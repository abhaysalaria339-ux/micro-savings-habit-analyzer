x-api-environment: &api-environment
  APP_NAME: Micro-Savings Habit Analyzer API
  APP_ENV: development
  APP_DEBUG: "false"
  API_V1_PREFIX: /api/v1
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/micro_savings
  JWT_SECRET_KEY: change-this-before-production-please
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
  BACKEND_CORS_ALLOW_METHODS: '["GET","POST","PATCH","DELETE","OPTIONS"]'
  BACKEND_CORS_ALLOW_HEADERS: '["Accept","Authorization","Content-Type"]'
  LOG_LEVEL: INFO
  LOG_FORMAT: plain

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: micro_savings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micro_savings"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
    image: micro-savings-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
    image: micro-savings-backend:local
    environment: *api-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
